<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 아토(마스코트)의 눈 — 시선을 마주치는 HRI 정체성을 파비콘으로.
       16px 로 축소돼도 "마주보는 얼굴"로 읽히도록 눈을 크게 잡았다. -->
  <rect width="64" height="64" rx="14" fill="#22211E"/>
  <!-- 바이저(얼굴 패널) — 눈을 감싸는 어두운 면 -->
  <rect x="3" y="13" width="58" height="38" rx="19" fill="#2C3D3A"/>
  <!-- 흰자 -->
  <circle cx="20" cy="32" r="11" fill="#F5F1E8"/>
  <circle cx="44" cy="32" r="11" fill="#F5F1E8"/>
  <!-- 눈동자 (정면 응시) -->
  <circle cx="20" cy="32" r="5.6" fill="#12201B"/>
  <circle cx="44" cy="32" r="5.6" fill="#12201B"/>
  <!-- 캐치라이트 — 살아있는 눈빛 + 브랜드 액센트 -->
  <circle cx="17.6" cy="29.6" r="2.5" fill="#3B82F6"/>
  <circle cx="41.6" cy="29.6" r="2.5" fill="#3B82F6"/>
</svg>
