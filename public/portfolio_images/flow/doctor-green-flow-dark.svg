<svg width="680" height="554" viewBox="0 0 680 554" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Doctor-Green smart-farm platform system flow</title>
<desc>IoT pipeline: ESP32 sensor nodes post directly to Supabase over Wi-Fi (no relay server); a Next.js dashboard visualizes readings with 5-second polling and controls actuators via a desired-state pattern. AI diagnosis: USB camera video to YOLOv8 across 7 strawberry-disease classes, feeding results into the dashboard. Deployed on Vercel with Roboflow dataset; solo project.</desc>
<defs><marker id="arwE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:'Pretendard','Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif}
.iaBg{fill:#171614}.iaPoster{fill:#22201D;stroke:#2E2C28}.iaLogo{fill:#3B82F6}.iaLogoR{fill:#FFFFFF;font-size:22px;font-weight:600}
.iaTtl{fill:#F0EDE6;font-size:19px;font-weight:600}.iaSub{fill:#969288;font-size:12.5px}.iaHdiv{stroke:#2E2C28}.iaFdiv{stroke:#2E2C28}
.iaSec{fill:#2E2C28;stroke:#3A3833}.iaDot{fill:#3B82F6}.iaLab{fill:#F0EDE6;font-size:12px;font-weight:600}.iaLeg{fill:#969288;font-size:11.5px}
.iaSw1{fill:#22201D;stroke:#3A3833}.iaSw2{fill:#252C38;stroke:#3D4B63}.iaSw3{fill:#3B82F6;stroke:#5B9AF8}.iaSw4{fill:#1C1B18;stroke:#3A3833}
.iaEbox{fill:#22201D;stroke:#3A3833}.iaEt{fill:#F0EDE6;font-size:14px;font-weight:600}.iaEs{fill:#969288;font-size:12px}
.iaArw{stroke:#3B82F6;stroke-width:1.4;fill:none}.iaLeader{stroke:#5C82C4;stroke-width:1;stroke-dasharray:3 3;fill:none}.iaMgr{stroke:#3B82F6;stroke-width:1.5;fill:none}
.iaMbox{fill:#3B82F6;stroke:#5B9AF8}.iaMt{fill:#FFFFFF;font-size:14px;font-weight:600}.iaMs{fill:#D8E6FD;font-size:12px}
.iaCcard{fill:#252C38;stroke:#3D4B63}.iaCt{fill:#F0EDE6;font-size:14px;font-weight:600}.iaCl{fill:#9BA4B4;font-size:12px}
.iaPcbox{fill:#283548;stroke:#46608C}.iaPt{fill:#F0EDE6;font-size:14px;font-weight:600}.iaPs{fill:#9BA4B4;font-size:12px}
.iaChip{fill:#1C1B18;stroke:#3A3833}.iaChx{fill:#F0EDE6;font-size:12px}.iaFoot{fill:#969288;font-size:11px}
</style>

