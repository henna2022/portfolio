<svg width="680" height="602" viewBox="0 0 680 602" role="img" xmlns="http://www.w3.org/2000/svg">
<title>ATO companion and care robot system flow</title>
<desc>Inputs (PIR proximity, capacitive touch, button) feed an ESP32 core running Arduino C++, driving dual round-LCD eyes, servo ears and arms, and DFPlayer audio. YAKMOA band: camera with multimodal AI recognizes medicine and drives dose schedules and reminders.</desc>
