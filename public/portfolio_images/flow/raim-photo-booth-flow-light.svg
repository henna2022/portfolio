<line class="iaArw" x1="432" y1="180" x2="448" y2="180" marker-end="url(#arwE)"/>
<rect class="iaCcard" x="450" y="158" width="186" height="44" rx="10"/><text class="iaCt" x="543" y="180" text-anchor="middle">AI best-shot pick</text><text class="iaCl" x="543" y="196" text-anchor="middle">Scores &amp; selects cuts</text>
<path class="iaArw" d="M543 202 V209 H134 V214" marker-end="url(#arwE)"/>
<rect class="iaCcard" x="44" y="216" width="180" height="44" rx="10"/><text class="iaCt" x="134" y="238" text-anchor="middle">Frame composition</text><text class="iaCl" x="134" y="254" text-anchor="middle">Four-cut layout</text>
<line class="iaArw" x1="224" y1="238" x2="250" y2="238" marker-end="url(#arwE)"/>
<rect class="iaMbox" x="252" y="216" width="180" height="44" rx="10"/><text class="iaMt" x="342" y="238" text-anchor="middle">QR code issued</text><text class="iaMs" x="342" y="254" text-anchor="middle">Shown on screen</text>
<line class="iaArw" x1="432" y1="238" x2="448" y2="238" marker-end="url(#arwE)"/>
<rect class="iaMbox" x="450" y="216" width="186" height="44" rx="10"/><text class="iaMt" x="543" y="238" text-anchor="middle">Phone download</text><text class="iaMs" x="543" y="254" text-anchor="middle">Visitor saves photo</text>

<rect class="iaSec" x="28" y="286" width="624" height="80" rx="12"/>
<circle class="iaDot" cx="44" cy="303" r="3"/><text class="iaLab" x="52" y="307">Event notes</text>
<rect class="iaChip" x="44" y="316" width="200" height="36" rx="9"/><text class="iaChx" x="144" y="338" text-anchor="middle">2nd-anniversary event</text>
<rect class="iaChip" x="260" y="316" width="200" height="36" rx="9"/><text class="iaChx" x="360" y="338" text-anchor="middle">Robot character frames</text>
<rect class="iaChip" x="476" y="316" width="160" height="36" rx="9"/><text class="iaChx" x="556" y="338" text-anchor="middle">No printer · QR only</text>

<line class="iaFdiv" x1="34" y1="386" x2="646" y2="386"/>
<text class="iaFoot" x="340" y="402" text-anchor="middle">RAIM AI Photo Booth · Experience Flow © Juwon Lee</text>
</svg>
