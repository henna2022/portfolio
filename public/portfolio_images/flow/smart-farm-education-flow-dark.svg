<svg width="680" height="554" viewBox="0 0 680 554" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Smart-Farm Education Program system flow</title>
<desc>IoT sensor kit to ESP32 node to relay server to live database to student web dashboard; location-based Weather API branch; YOLO crop-disease AI module with diagnosis demo.</desc>
