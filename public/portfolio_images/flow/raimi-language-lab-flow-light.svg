<line class="iaArw" x1="324" y1="238" x2="352" y2="238" marker-end="url(#arwE)"/>
<rect class="iaCcard" x="356" y="216" width="280" height="44" rx="10"/><text class="iaCt" x="496" y="238" text-anchor="middle">Concepts</text><text class="iaCl" x="496" y="254" text-anchor="middle">Tokens · embeddings · attention</text>
<path class="iaArw" d="M496 260 V267 H184 V272" marker-end="url(#arwE)"/>
<rect class="iaCcard" x="44" y="274" width="280" height="44" rx="10"/><text class="iaCt" x="184" y="296" text-anchor="middle">Stamps</text><text class="iaCl" x="184" y="312" text-anchor="middle">One stamp per lesson</text>
<line class="iaArw" x1="324" y1="296" x2="352" y2="296" marker-end="url(#arwE)"/>
<rect class="iaMbox" x="356" y="274" width="280" height="44" rx="10"/><text class="iaMt" x="496" y="296" text-anchor="middle">Complete</text><text class="iaMs" x="496" y="312" text-anchor="middle">All 5 stamps · confetti</text>
<line class="iaLeader" x1="120" y1="273" x2="120" y2="262" marker-end="url(#arwE)"/>
<text class="iaEs" x="112" y="270" text-anchor="end">next lesson</text>

<rect class="iaSec" x="28" y="344" width="624" height="82" rx="12"/>
<circle class="iaDot" cx="44" cy="361" r="3"/><text class="iaLab" x="52" y="365">Exhibition deployment · fully client-side</text>
<rect class="iaChip" x="44" y="376" width="190" height="36" rx="9"/><text class="iaChx" x="139" y="398" text-anchor="middle">No backend · no server</text>
<rect class="iaChip" x="250" y="376" width="190" height="36" rx="9"/><text class="iaChx" x="345" y="398" text-anchor="middle">Offline-capable PWA</text>
<rect class="iaChip" x="456" y="376" width="180" height="36" rx="9"/><text class="iaChx" x="546" y="398" text-anchor="middle">Exhibition tablet ready</text>

<line class="iaFdiv" x1="34" y1="446" x2="646" y2="446"/>
<text class="iaFoot" x="340" y="462" text-anchor="middle">Raimi's AI Language Lab · App Flow © Juwon Lee</text>
