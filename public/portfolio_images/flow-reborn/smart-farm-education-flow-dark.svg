.iaSw1{fill:#1E1E1C;stroke:#363532}.iaSw2{fill:#1D2440;stroke:#34407A}.iaSw3{fill:#3C66FF;stroke:#6F8CFF}.iaSw4{fill:#1A1A18;stroke:#363532}
.iaEbox{fill:#1E1E1C;stroke:#363532}.iaEt{fill:#ECE9E2;font-size:14px;font-weight:600}.iaEs{fill:#9A978F;font-size:12px}
.iaArw{stroke:#3C66FF;stroke-width:1.4;fill:none}.iaLeader{stroke:#5A78D6;stroke-width:1;stroke-dasharray:3 3;fill:none}.iaMgr{stroke:#3C66FF;stroke-width:1.5;fill:none}
.iaMbox{fill:#3C66FF;stroke:#6F8CFF}.iaMt{fill:#FFFFFF;font-size:14px;font-weight:600}.iaMs{fill:#DDE4FF;font-size:12px}
.iaCcard{fill:#1D2440;stroke:#34407A}.iaCt{fill:#ECE9E2;font-size:14px;font-weight:600}.iaCl{fill:#A9B3D6;font-size:12px}
.iaPcbox{fill:#1F2A52;stroke:#3E54A0}.iaPt{fill:#ECE9E2;font-size:14px;font-weight:600}.iaPs{fill:#A9B3D6;font-size:12px}
.iaChip{fill:#1A1A18;stroke:#363532}.iaChx{fill:#ECE9E2;font-size:12px}.iaFoot{fill:#9A978F;font-size:11px}
</style>

