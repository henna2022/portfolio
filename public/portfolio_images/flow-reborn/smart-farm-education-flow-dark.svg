<svg width="680" height="554" viewBox="0 0 680 554" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Smart-Farm Education Program system flow</title>
<desc>16 student ESP32 boards running Arduino (C++) firmware post temperature, humidity and soil readings directly to a Supabase practice database over Wi-Fi (no relay server); a Next.js student web app on Vercel shows live values and controls the LED, fan and pump. A server API route fetches KMA weather by location. AI vision: in-browser transfer learning with TensorFlow.js on MobileNet v2, a holdout test, then a camera check on a real leaf.</desc>
<defs><marker id="arwE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
